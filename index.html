<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEDAI PRO AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:white;
 font-family:Arial,sans-serif;padding:22px;
}
h1{color:#d8b45c;text-align:center}
p{text-align:center;color:#aaa}
.card{
 background:#191919;border:1px solid #80652e;
 padding:20px;border-radius:18px;margin-top:20px;
}
button{
 width:100%;padding:15px;border:0;border-radius:12px;
 background:#d8b45c;color:#111;font-weight:bold;
 margin-top:15px;font-size:16px;
}
input,select{
 width:100%;padding:14px;margin-top:12px;
 background:#292929;color:white;border:1px solid #555;
 border-radius:10px;
}
video{width:100%;margin-top:15px;border-radius:12px}
</style>
</head>
<body>
<h1>WEDAI PRO AI</h1>
<p>Professional Automatic Video Editing Studio</p>

<div class="card">
<h2>Upload Your Video</h2>
<input type="file" id="video" accept="video/*" multiple>
<video id="preview" controls hidden></video>
</div>

<div class="card">
<h2>Choose Editing Style</h2>
<select id="style">
<option>Wedding Cinematic</option>
<option>Pre Wedding</option>
<option>Birthday</option>
<option>Instagram Reels</option>
<option>Travel Cinematic</option>
</select>
</div>

<div class="card">
<h2>Upload Music</h2>
<input type="file" id="music" accept="audio/*">
</div>

<button onclick="startEdit()">START AI EDITING</button>
<p id="status">Your editing studio is ready.</p>

<script>
const video=document.getElementById('video');
video.addEventListener('change',()=>{
 const file=video.files[0];
 if(file){
 const player=document.getElementById('preview');
 player.src=URL.createObjectURL(file);
 player.hidden=false;
 }
});
function startEdit(){
 const files=video.files;
 if(!files.length){
 alert('Please upload your video first.');
 return;
 }
 document.getElementById('status').textContent=
 'Video uploaded. AI processing engine needs to be connected.';
}
</script>
</body>
</html>
